<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Valentine ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      text-align: center;
      padding: 40px 20px;
      color: #333;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    h1 {
      color: #e91e63;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
    }
    footer {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>❤️ Will You Be My Valentine? ❤️</h1>
    <p>
      Dear Love,<br><br>
      You make my ordinary days feel special just by being in my life.
      This small website is only to tell you how important you are to me.
      <br><br>
      Always with you 💕
    </p>
    <footer>
      — From Harsha
    </footer>
  </div>
</body>
</html>
